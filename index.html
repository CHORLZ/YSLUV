<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>

<!-- PWA / Add to Home Screen -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#ff4d6d">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top, #ffb3c6, #ff4d6d);
        font-family: 'Segoe UI', Tahoma, sans-serif;
        overflow: hidden;
    }

    /* floating hearts background */
    .heart {
        position: absolute;
        font-size: 20px;
        animation: float 6s linear infinite;
        opacity: 0.7;
    }

    @keyframes float {
        0% {
            transform: translateY(100vh) scale(0.5);
        }
        100% {
            transform: translateY(-10vh) scale(1.2);
        }
    }

    .card {
        background: linear-gradient(145deg, #fff0f3, #ffffff);
        padding: 35px 30px;
        border-radius: 25px;
        text-align: center;
        box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        width: 330px;
        position: relative;
        animation: pop 0.6s ease;
    }

    @keyframes pop {
        from {
            transform: scale(0.8);
            opacity: 0;
        }
        to {
            transform: scale(1);
            opacity: 1;
        }
    }

    .icon {
        font-size: 45px;
        margin-bottom: 10px;
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0%,100% { transform: scale(1); }
        50% { transform: scale(1.15); }
    }

    h1 {
        color: #ff4d6d;
        margin-bottom: 20px;
    }

    .buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
    }

    button {
        padding: 12px 22px;
        font-size: 18px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    #yesBtn {
        background: linear-gradient(135deg, #ff4d6d, #ff758f);
        color: white;
        box-shadow: 0 8px 15px rgba(255,77,109,0.4);
    }

    #yesBtn:hover {
        transform: scale(1.1);
    }

    #noBtn {
        background-color: #ffe5ec;
        color: #ff4d6d;
        box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    #message {
        margin-top: 18px;
        color: #ff4d6d;
        font-weight: bold;
        min-height: 20px;
        animation: fade 0.4s;
    }

    @keyframes fade {
        from { opacity: 0; }
        to { opacity: 1; }
    }
</style>
</head>

<body>

<!-- floating hearts -->
<span class="heart" style="left:10%; animation-delay:0s;">❤️</span>
<span class="heart" style="left:30%; animation-delay:2s;">💖</span>
<span class="heart" style="left:50%; animation-delay:4s;">💕</span>
<span class="heart" style="left:70%; animation-delay:1s;">💘</span>
<span class="heart" style="left:90%; animation-delay:3s;">❤️</span>

<div class="card">
    <div class="icon">💘</div>
    <h1>Will you be my Valentine?</h1>

    <div class="buttons">
        <button id="yesBtn" onclick="yesClick()">YES</button>
        <button id="noBtn" onclick="noClick()">NO</button>
    </div>

    <p id="message"></p>
</div>

<script>
    let yesSize = 18;
    let noMessages = [
        "are you sure?",
        "baby u sure?",
        "babyyyyyy 🥺",
        "just say yes baby 💕",
        "baby pleaseeeee 😭"
    ];
    let index = 0;

    function noClick() {
        yesSize += 8;
        document.getElementById("yesBtn").style.fontSize = yesSize + "px";

        document.getElementById("message").innerText =
            noMessages[index % noMessages.length];

        index++;
    }

    function yesClick() {
        document.querySelector(".card").innerHTML = `
            <div class="icon">❤️❤️❤️</div>
            <h1>I love u sm sweetheart 💕</h1>
            <p style="color:#ff4d6d;">Best Valentine ever 💖</p>
        `;
    }
</script>

</body>
</html>
